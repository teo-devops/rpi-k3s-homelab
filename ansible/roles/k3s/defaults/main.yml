# Rol k3s: instala K3s como server o como agent.
# k3s_role lo fija el playbook según el grupo del inventario (k3s_server / k3s_agents).
k3s_role: ""

k3s_version: v1.36.6+k3s1
k3s_install_script_url: https://get.k3s.io
k3s_config_dir: /etc/rancher/k3s

# Dirección del API server, usada por los agents para unirse.
k3s_server_host: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
k3s_server_url: "https://{{ k3s_server_host }}:6443"

# Redes internas (ver docs/03-red/01-plan-de-direcciones.md).
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Componentes de K3s que NO instalamos:
#   servicelb -> lo sustituye Cilium LB-IPAM
#   traefik   -> lo instalaremos nosotros con Flux (fase 5) para controlar su versión y valores
k3s_disable_components: [servicelb, traefik]

# Cifra los Secrets dentro de la base de datos de K3s. Coste casi nulo.
k3s_secrets_encryption: true

k3s_kubeconfig_local: "~/.kube/rpi-k3s-homelab.yaml"
k3s_kubeconfig_context: rpi-k3s-homelab
