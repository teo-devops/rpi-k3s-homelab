        <title id="capas-flux-title">Capas de Flux y su orden</title>
        <desc id="capas-flux-desc">Las cuatro Kustomizations de Flux en orden: flux-system, infra-controllers, infra-configs y apps, cada una esperando a la anterior con dependsOn.</desc>
        <defs>
      <style>#capas-flux-root { --color-paper: #f5f5f5;
