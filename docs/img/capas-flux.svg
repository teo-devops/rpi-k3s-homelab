      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #capas-flux-root { font-family: var(--font-sans); color: var(--color-ink); }
      #capas-flux-root .scroll { overflow-x: auto; }</style>
