      <style>#paquete-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #paquete-root { font-family: var(--font-sans); color: var(--color-ink); }
      #paquete-root .scroll { overflow-x: auto; }</style>
