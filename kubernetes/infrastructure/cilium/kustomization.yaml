# Cilium gestionado por Flux. Los valores siguen en values.yaml (el mismo
# fichero que usó `make cilium` en la fase 2): se convierten en un ConfigMap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    # helm-controller vigila este ConfigMap: si cambian los valores, actualiza ya.
    reconcile.fluxcd.io/watch: Enabled
