# Un servidor web mínimo expuesto con un Service LoadBalancer.
# Cilium le asigna una IP del pool y la anuncia en tu red.
# Guía: docs/06-redes-cilium/04-loadbalancer-en-casa.md
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0   # responde con el nombre del pod y la IP de origen
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  type: LoadBalancer
  selector: { app: whoami }
  ports:
    - port: 80
      targetPort: 80
